name: Desync
description: Players see different things, such as a player, enemy, door or chest in a different state.
labels: [bug, desync]
body:
  - type: markdown
    attributes:
      value: Desyncs need logs from every player in the session, taken right after it happened. Each player runs collect-logs.cmd in their kit folder and sends the zip privately (a Discord DM), not as an attachment here.
  - type: input
    id: version
    attributes:
      label: Co-op build and game version for each player
      description: The first line of VERSION.txt in each kit folder.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where you played
      options:
        - The kit's emulator (Lichii / Fritchii)
        - Hookshot (experimental)
        - The Linux kit (experimental)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How you connected
      options:
        - Invite code (Host.bat / Join.bat, Play-OoT-Coop.bat or the title screen)
        - VPN (Radmin VPN, Hamachi, ZeroTier, Tailscale)
        - Port forwarding
        - Relay with a join code
        - Same network (LAN)
        - Not sure
  - type: input
    id: players
    attributes:
      label: Number of players and who hosted
      description: For example "2 players, P1 hosted".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What each player saw
      description: Where you were (area, child or adult), and what was different between the games.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs from every player
      description: Say who sent their collect-logs zip privately, and whose is whose. Do not attach logs with addresses here.
    validations:
      required: true
