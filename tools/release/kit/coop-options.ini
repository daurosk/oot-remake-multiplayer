# Extra co-op switches. play.cmd reads this file and sets each line for the emulator.
# Everything here is off: remove the '#' at the start of a line to turn it on, then
# close the emulator and start play.cmd again. Only LICHII_COOP_... lines are read.
# A switch the emulator does not know is ignored by it. A file path may be relative
# to this kit folder.

# Shared world flags beyond the built-in item list: a text file, one flag a line
# (TESTING.md, "Shared flags file").
# LICHII_COOP_FLAGS=shared_flags.txt

# Turn the player's built-in item list off (on by default where the build has it).
# LICHII_COOP_ITEMS=0

# A debug window that gives you any shared item (key items, songs, tokens, keys),
# to check item sync without playing to it (TESTING.md, rows 12-14):
# LICHII_COOP_CHEATS=1

# The puppet Link (where the build has it; needs make-puppet-pack.cmd first).
# Turn on both lines: without the second a stand-in cow is shown. Adult Link:
# CoopPuppet_Adult.
# LICHII_COOP_PUPPET=1
# LICHII_COOP_PUPPET_ACTOR=CoopPuppet_Child

# Shared enemies: life and kills (on both PCs; TESTING.md, row 25).
# LICHII_COOP_OBJECTS=1

# Debug logging, for sending logs back. Each adds lines to emulator\user\log\eden_log.txt.
# Markers on yourself too, and where the camera puts them:
# LICHII_COOP_DEBUG_CAMERA=1
# If the markers are upside down:
# LICHII_COOP_CAMERA_FLIP_Y=1
# Every change in the game's flag tables:
# LICHII_COOP_DEBUG_FLAGS=1
# The enemies and projectiles around you:
# LICHII_COOP_DEBUG_OBJECTS=1
# A status line per puppet each second, plus one test puppet beside you:
# LICHII_COOP_DEBUG_PUPPET=1
