name: Bug
description: Something in co-op works wrongly but nothing crashed.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Co-op build and game version
      description: The first line of VERSION.txt in your kit folder, and the game version.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where you played
      options:
        - The kit's emulator (Lichii / Fritchii)
        - Hookshot (experimental)
        - The Linux kit (experimental)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How you connected
      options:
        - Invite code (Host.bat / Join.bat, Play-OoT-Coop.bat or the title screen)
        - VPN (Radmin VPN, Hamachi, ZeroTier, Tailscale)
        - Port forwarding
        - Relay with a join code
        - Same network (LAN)
        - Not sure
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
