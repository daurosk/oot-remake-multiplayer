name: Crash
description: The game or the co-op build closes, freezes or shows an error.
labels: [bug, crash]
body:
  - type: markdown
    attributes:
      value: Do not attach or link game files, keys, firmware or builds that contain them. Issues that do are closed.
  - type: input
    id: version
    attributes:
      label: Co-op build and game version
      description: The first line of VERSION.txt in your kit folder, and the game version (1.1.1 is the supported one).
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where you played
      options:
        - The kit's emulator (Lichii / Fritchii)
        - Hookshot (experimental)
        - The Linux kit (experimental)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How you connected
      options:
        - Invite code (Host.bat / Join.bat, Play-OoT-Coop.bat or the title screen)
        - VPN (Radmin VPN, Hamachi, ZeroTier, Tailscale)
        - Port forwarding
        - Relay with a join code
        - Same network (LAN)
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you were doing, and what happened instead of what you expected.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the last lines of the log that have no addresses or names in them (eden_log.txt on the emulator, hookshot_log.txt on Hookshot). For the full logs, run collect-logs.cmd and send its zip privately (a Discord DM), not here.
      render: text
