name: Crash
description: The game or the co-op build closes, freezes or shows an error.
labels: [bug, crash]
body:
  - type: markdown
    attributes:
      value: Do not attach or link game files, keys, firmware or builds that contain them. Issues that do are closed.
  - type: input
    id: version
    attributes:
      label: Co-op build and game version
      description: The first line of the kit's VERSION.txt, and the game version.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where you played
      options:
        - The kit's emulator (Lichii / Fritchii)
        - Hookshot (experimental)
        # DROP the next option if linux-2 is not in the release
        - The Linux kit (experimental)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How you connected
      options:
        - Invite code (Host.bat / Join.bat)
        - VPN (Radmin VPN, Hamachi, ZeroTier, Tailscale)
        - Port forwarding
        - Relay with a join code
        - Same network (LAN)
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you were doing, and what happened instead of what you expected.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the end of the emulator log, or attach the log file.
      render: text
