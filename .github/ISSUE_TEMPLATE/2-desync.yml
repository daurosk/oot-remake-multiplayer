name: Desync
description: Players see different things, such as a player, enemy, door or chest in a different state.
labels: [bug, desync]
body:
  - type: markdown
    attributes:
      value: Desyncs need logs from every player in the session, taken right after it happened.
  - type: input
    id: version
    attributes:
      label: Squadala! version and game version for each player
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where you played
      options:
        - An old emulator kit (Lichii / Fritchii, retired)
        - Hookshot (experimental)
        - The Linux kit (experimental)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How you connected
      options:
        - Invite code (Host.bat / Join.bat)
        - VPN (Radmin VPN, Hamachi, ZeroTier, Tailscale)
        - Port forwarding
        - Relay with a join code
        - Same network (LAN)
        - Not sure
  - type: input
    id: players
    attributes:
      label: Number of players and who hosted
      description: For example "2 players, P1 hosted".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What each player saw
      description: Where you were (area, child or adult), and what was different between the games.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs from every player
      description: Each player sends their zip from `scripts\collect-logs.cmd` with `/bugreport` on the Squadala! Discord (not here). List the report numbers and say whose is whose; paste only the `coop:` lines you need, addresses masked.
    validations:
      required: true
