name: Release attest

# Signs each kit release (issue 161). When a release is published, this workflow
# downloads its kit zip (and Update.bat), checks the zip against the release's
# .sha256, and makes a GitHub artifact attestation for each file: a statement
# signed through Sigstore with this repository's workflow identity (no key or
# secret anywhere: the signing certificate comes from GitHub's OIDC token and is
# logged publicly). Anyone can then check a download with
#   gh attestation verify <file> --repo daurosk/oot-remake-multiplayer \
#     --signer-workflow daurosk/oot-remake-multiplayer/.github/workflows/release-attest.yml
# or tools/release/verify_kit.ps1. See docs/setup.md "Check the download".
#
# Run by hand for a release whose workflow did not run (published as a draft
# first, or before this file existed): gh workflow run release-attest.yml -f tag=<tag>
# Run with no tag (or on a push that changes this file or the verify script):
# self-test with a made-up zip, attested, verified, and a changed copy refused.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest (empty: self-test with a made-up zip)"
        required: false
        default: ""
  push:
    paths:
      - .github/workflows/release-attest.yml
      - tools/release/verify_kit.ps1

permissions:
  contents: read

jobs:
  attest-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the kit assets and check the SHA-256
        run: |
          mkdir kit
          cd kit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "oot-coop-$TAG.zip" --pattern "oot-coop-$TAG.zip.sha256" --pattern "Update.bat"
          ls -l
          test -f "oot-coop-$TAG.zip" || { echo "::error::release $TAG has no oot-coop-$TAG.zip"; exit 1; }
          sha256sum -c "oot-coop-$TAG.zip.sha256"
          # The Linux kit (issue 127), when the release has one: its update.sh checks it too.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "oot-coop-$TAG-linux-*.tar.gz" --pattern "oot-coop-$TAG-linux-*.tar.gz.sha256" || true
          # The Longshot Linux kit (a zip: tools/release/make_kit_linux.sh), when the release has one.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "oot-coop-$TAG-linux-x86_64.zip" --pattern "oot-coop-$TAG-linux-x86_64.zip.sha256" || true
          for sum in oot-coop-*-linux-*.tar.gz.sha256 oot-coop-*-linux-x86_64.zip.sha256; do [ -f "$sum" ] && sha256sum -c "$sum"; done
          {
            echo "subjects<<EOF"
            ls -1 "$PWD"/oot-coop-*.zip "$PWD"/oot-coop-*-linux-*.tar.gz "$PWD"/Update.bat 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        id: assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.subjects }}
      - name: Verify the attestation
        run: |
          for f in kit/oot-coop-*.zip kit/oot-coop-*-linux-*.tar.gz kit/Update.bat; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-attest.yml"
          done

  self-test:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Make a made-up kit zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force selftest/oot-coop-v0.0.0-beta | Out-Null
          Set-Content selftest/oot-coop-v0.0.0-beta/README.txt "release-attest self-test $env:GITHUB_SHA $env:GITHUB_RUN_ID"
          & "$env:SystemRoot\System32\tar.exe" -a -c -f selftest/oot-coop-v0.0.0-beta.zip -C selftest oot-coop-v0.0.0-beta
          $hash = (Get-FileHash selftest/oot-coop-v0.0.0-beta.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/selftest/oot-coop-v0.0.0-beta.zip.sha256", "$hash  oot-coop-v0.0.0-beta.zip`n")
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: selftest/oot-coop-v0.0.0-beta.zip
      - name: verify_kit.ps1 accepts the attested zip
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify_kit.ps1 -Zip selftest/oot-coop-v0.0.0-beta.zip -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "verify_kit.ps1 refused the attested zip ($LASTEXITCODE)" }
      - name: verify_kit.ps1 refuses a changed zip
        shell: pwsh
        run: |
          Copy-Item selftest/oot-coop-v0.0.0-beta.zip selftest/changed.zip
          Add-Content selftest/changed.zip "x" -NoNewline
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify_kit.ps1 -Zip selftest/changed.zip -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) { throw "verify_kit.ps1 accepted a changed zip" }
          Write-Host "Changed zip refused (exit $LASTEXITCODE), as it should be."
          # The .sha256 check too: the original zip with a wrong checksum file.
          Copy-Item selftest/oot-coop-v0.0.0-beta.zip selftest/wrongsum.zip
          [IO.File]::WriteAllText("$PWD/selftest/wrongsum.zip.sha256", ("0" * 64) + "  wrongsum.zip`n")
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify_kit.ps1 -Zip selftest/wrongsum.zip -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) { throw "verify_kit.ps1 accepted a zip whose .sha256 does not match" }
          Write-Host "Wrong .sha256 refused (exit $LASTEXITCODE), as it should be."
          exit 0
