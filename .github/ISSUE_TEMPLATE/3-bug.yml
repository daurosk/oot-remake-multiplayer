name: Bug
description: Something in Squadala! works wrongly but nothing crashed.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Squadala! version and game version
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where you played
      options:
        - An old emulator kit (Lichii / Fritchii, retired)
        - Hookshot (experimental)
        - The Linux kit (experimental)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How you connected
      options:
        - Invite code (Host.bat / Join.bat)
        - VPN (Radmin VPN, Hamachi, ZeroTier, Tailscale)
        - Port forwarding
        - Relay with a join code
        - Same network (LAN)
        - Not sure
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
