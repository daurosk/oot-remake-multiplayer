# Co-op switches. Host.bat, Join.bat and play.cmd read this file and set each line
# for the emulator. A line with '#' in front is off: add or remove the '#', then close
# the emulator and start it again. Only LICHII_COOP_... lines are read. A file path may
# be relative to this kit folder. Every player should use the same switches.

# --- On by default ---

# The other players as Link (the real Link puppet, child or adult by your save's age),
# with their Navi. Needs the puppet pack (make-puppet-pack.cmd, once per PC); without
# the pack the others show only as markers.
LICHII_COOP_PUPPET=1

# Shared enemies and townspeople: life and kills follow the player who owns them.
LICHII_COOP_OBJECTS=1

# Objects a player makes (Deku seeds, nuts, bombs, arrows) appear in the other games.
LICHII_COOP_SPAWN=1

# Items, songs, one-time pickups, small keys, Skulltula tokens, heart pieces and the
# dungeons' switches, doors, cleared rooms and water levels are shared without a switch.
# To turn them off:
# LICHII_COOP_ITEMS=0
# LICHII_COOP_DUNGEON=0
# No Navi on the other players:
# LICHII_COOP_FAIRY=0

# --- Off by default ---

# Always the child (or adult) puppet, whatever the save's age:
# LICHII_COOP_PUPPET_ACTOR=CoopPuppet_Child

# More shared world flags: a text file, one flag a line (TESTING.md, "Shared flags file").
# LICHII_COOP_FLAGS=shared_flags.txt

# A debug window that gives you any shared item (key items, songs, tokens, keys),
# to check item sync without playing to it:
# LICHII_COOP_CHEATS=1

# Debug logging, for sending logs back (collect-logs.cmd). Each adds lines to
# emulator\user\log\eden_log.txt.
# Markers on yourself too, and where the camera puts them:
# LICHII_COOP_DEBUG_CAMERA=1
# If the markers are upside down:
# LICHII_COOP_CAMERA_FLIP_Y=1
# Every change in the game's flag tables:
# LICHII_COOP_DEBUG_FLAGS=1
# The enemies and objects around you:
# LICHII_COOP_DEBUG_OBJECTS=1
# A status line per puppet each second, plus one test puppet beside you:
# LICHII_COOP_DEBUG_PUPPET=1
