# Co-op switches. Host.bat, Join.bat and play.cmd read this file and set each line
# for the emulator. A line with '#' in front is off: add or remove the '#', then close
# the emulator and start it again. Only LICHII_COOP_..., EDEN_NX2_..., auto_update and the
# host's server_..., public_address_lookup, upnp, invite, stun_servers, relay, relay_key
# and color lines are read.
# A file path may be relative to this kit folder. Every player should use the same switches.

# --- Updates ---

# When Host.bat, Join.bat or play.cmd start and a newer co-op release is out, the kit
# updates itself (the emulator too, never with Fritchii's own updater) and starts the new
# version; your saves, keys, settings and this file are kept. ask: ask first (yes after 10 s
# with no key); yes: update without asking; no: only say that one is out (Update.bat).
auto_update = ask

# The update is checked against the SHA-256 published with the release. If the GitHub CLI
# (gh) is installed and logged in, the release's signature (attestation) is checked too, and
# an update that fails it is refused. To skip that signature check (not the SHA-256), take
# the '#' away:
# verify_signature = no

# --- Your colour ---

# Each player's Link wears a tunic in that player's colour in the other games, so you can
# tell each other apart (ten tunic colours; another colour gets the nearest). Remove the '#' and pick yours: red, orange, yellow, green, cyan, blue,
# purple, pink, white, black, brown, gray, or #RRGGBB (for example #FF8020). With the '#'
# in front, the one who hosts is blue and the others red, your own Link included (three or more
# players: pick colours, or the joiners all wear red).
# color = blue

# --- Who may join (the host only) ---

# The join password. Every session has one, and the traffic is encrypted with it. With no
# line here, or an empty one (the usual way), Host.bat makes a new random one each time it
# starts and puts it in the invite code, so nobody has to type it; the server window shows it
# for friends who join by address (Radmin, Hamachi, home network, port forward). Set your own
# here if you want the same one every time (no spaces; Join.bat then asks your friends for it
# unless they use the invite code). It never goes over the network (only a proof of it does).
# server_password =

# Only these players' addresses may join your server: their Hamachi (25.x.x.x) or Radmin
# (26.x.x.x) addresses, or their public addresses with port forwarding, comma-separated;
# a whole range as 26.0.0.0/8. Anyone else is turned away before they can send anything.
# server_allow = 25.1.2.3,25.4.5.6
# Listen only on this address of your PC (your own Hamachi or Radmin address), so the
# server cannot be reached through your home network or Wi-Fi at all.
# server_bind = 25.1.2.3
# When the server starts it asks api.ipify.org (over HTTPS) for your internet address, to
# show it to you for port forwarding. Remove the '#' to not ask.
# public_address_lookup = no

# --- Hosting without router setup (the host only; docs/play-online.md) ---

# Host.bat asks your router (UPnP) to forward the game's UDP port to this PC while the server
# runs, with a 10-minute lease it renews, and removes it when the server window closes. Many
# routers have UPnP off; then the invite code below still works for
# most friends. Remove the '#' to never ask the router:
# upnp = no
# Host.bat asks a free public STUN server (Google's, then Cloudflare's) for your internet
# address, from the game's own port, and shows an INVITE CODE (your internet address and the
# join password) that it copies to the clipboard. Your friends paste it into Join.bat. The
# STUN server sees your internet address, nothing of the game. Remove the '#' to turn it off:
# invite = no
# Other STUN servers to ask (name:port, comma-separated):
# stun_servers = stun.l.google.com:19302, stun.cloudflare.com:3478

# Advanced, off: host through a relay instead (no router or VPN setup): someone whose UDP port is open runs
# start-relay.cmd; put their address here. The server window then shows a join code
# (CODE@relay) for your friends to paste into Join.bat. The code only finds your server; the
# join password keeps strangers out, and the relay cannot read your game traffic (it is
# encrypted with the password).
# relay = relay.example.net:27530
# The relay's host key, if its owner gave you one:
# relay_key =
# --- Player against player (the host only) ---

# on: players can hurt each other with swords, items and shots, as enemies do. The host's
# value is the whole session's (a guest's line here does nothing), and the host can change it
# while playing by typing /pvp on or /pvp off in the chat. Nobody is hurt in a cutscene, a
# menu or while loading.
pvp = off

# --- On by default ---

# The other players as Link (the real Link puppet, child or adult by your save's age),
# with their Navi. Needs the puppet pack (make-puppet-pack.cmd, once per PC); without
# the pack the others show only as markers.
LICHII_COOP_PUPPET=1

# Shared enemies and townspeople: life and kills follow the player who owns them.
# Pots, crates and rocks are shared the same way.
LICHII_COOP_OBJECTS=1

# Objects a player makes (Deku seeds, nuts, bombs, arrows) appear in the other games.
LICHII_COOP_SPAWN=1

# Items, songs, one-time pickups, small keys, Skulltula tokens, heart pieces and the
# dungeons' switches, doors, cleared rooms and water levels are shared without a switch.
# To turn them off:
# LICHII_COOP_ITEMS=0
# LICHII_COOP_DUNGEON=0
# Time of day follows the host (on without a switch). To turn it off:
# LICHII_COOP_TIME=0
# No Navi on the other players:
# LICHII_COOP_FAIRY=0
# The other players' tunic colours; 0 shows everyone in green:
# LICHII_COOP_TUNICS=0

# --- Off by default ---

# Always the child (or adult) puppet, whatever the save's age:
# LICHII_COOP_PUPPET_ACTOR=CoopPuppet_Child

# More shared world flags: a text file, one flag a line (TESTING.md, "Shared flags file").
# LICHII_COOP_FLAGS=shared_flags.txt

# A debug window that gives you any shared item (key items, songs, tokens, keys),
# to check item sync without playing to it:
# LICHII_COOP_CHEATS=1

# Debug logging, for sending logs back (collect-logs.cmd). Each adds lines to
# emulator\user\log\eden_log.txt.
# Markers on yourself too, and where the camera puts them:
# LICHII_COOP_DEBUG_CAMERA=1
# If the markers are upside down:
# LICHII_COOP_CAMERA_FLIP_Y=1
# Every change in the game's flag tables:
# LICHII_COOP_DEBUG_FLAGS=1
# The enemies and objects around you:
# LICHII_COOP_DEBUG_OBJECTS=1
# A status line per puppet each second:
# LICHII_COOP_DEBUG_PUPPET=1
# One test puppet beside you (a second Link and fairy that stand still):
# LICHII_COOP_TEST_PUPPET=1

# --- Emulator ---

# Shader libraries (graphics pipeline libraries). With an AMD card and no NVIDIA one the kit
# turns them off by itself, since AMD's driver crashes with them (amdvlk64.dll). A line here
# wins over that: 0 off (try it if the game crashes in amdvlk64.dll), 1 on.
# EDEN_NX2_GPL=0
