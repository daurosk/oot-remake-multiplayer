name: Release attest

# Signs each kit release (issue 161). When a release is published, this workflow
# downloads its kit zip (and Update.bat), checks the zip against the release's
# .sha256, and makes a GitHub artifact attestation for each file: a statement
# signed through Sigstore with this repository's workflow identity (no key or
# secret anywhere: the signing certificate comes from GitHub's OIDC token and is
# logged publicly). Anyone can then check a download with
#   gh attestation verify <file> --repo daurosk/oot-remake-multiplayer \
#     --signer-workflow daurosk/oot-remake-multiplayer/.github/workflows/release-attest.yml
# or tools/release/verify_kit.ps1. See docs/setup.md "Check the download".
#
# Run by hand for a release whose workflow did not run (published as a draft
# first, or before this file existed): gh workflow run release-attest.yml -f tag=<tag>
# Run with no tag (or on a push that changes this file or the verify script):
# self-test with a made-up zip, attested, verified, and a changed copy refused.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest (empty: self-test with a made-up zip)"
        required: false
        default: ""
  push:
    paths:
      - .github/workflows/release-attest.yml
      - tools/release/verify_kit.ps1

permissions:
  contents: read

jobs:
  attest-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the kit assets and check the SHA-256
        run: |
          mkdir kit
          cd kit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "oot-coop-$TAG.zip" --pattern "oot-coop-$TAG.zip.sha256" --pattern "Update.bat" \
            --pattern "oot-coop-$TAG-windows.zip" --pattern "oot-coop-$TAG-windows.zip.sha256" \
            --pattern "Squadala-$TAG-windows.zip" --pattern "Squadala-$TAG-windows.zip.sha256"
          ls -l
          # The Windows kit: Squadala-<tag>-windows.zip from v0.11.3 on, the only name from v0.11.4 on; oot-coop-<tag>.zip
          # (every release up to v0.11.3) and oot-coop-<tag>-windows.zip (v0.11.0 to v0.11.2) are the same file where a
          # release has them.
          test -f "Squadala-$TAG-windows.zip" || test -f "oot-coop-$TAG.zip" ||
            { echo "::error::release $TAG has no Squadala-$TAG-windows.zip (nor an oot-coop-$TAG.zip of an older release)"; exit 1; }
          first=''
          for f in "Squadala-$TAG-windows.zip" "oot-coop-$TAG.zip" "oot-coop-$TAG-windows.zip"; do
            if [ ! -f "$f" ]; then continue; fi
            sha256sum -c "$f.sha256"
            if [ -z "$first" ]; then first=$f; else cmp -s "$first" "$f" || { echo "::error::$first and $f differ"; exit 1; }; fi
          done
          # The Linux kit (issue 127), when the release has one: its update.sh checks it too.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "oot-coop-$TAG-linux-*.tar.gz" --pattern "oot-coop-$TAG-linux-*.tar.gz.sha256" || true
          # The Longshot Linux kit (a zip: tools/release/make_kit_linux.sh), when the release has one: Squadala-<tag>-linux.zip
          # (and up to v0.11.3 the same file as oot-coop-<tag>-linux.zip).
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "oot-coop-$TAG-linux.zip" --pattern "oot-coop-$TAG-linux.zip.sha256" \
            --pattern "Squadala-$TAG-linux.zip" --pattern "Squadala-$TAG-linux.zip.sha256" || true
          if [ -f "Squadala-$TAG-linux.zip" ] && [ -f "oot-coop-$TAG-linux.zip" ]; then
            cmp -s "oot-coop-$TAG-linux.zip" "Squadala-$TAG-linux.zip" || { echo "::error::oot-coop-$TAG-linux.zip and Squadala-$TAG-linux.zip differ"; exit 1; }
          fi
          # Every kit asset is named here, so a kit is never signed by accident or left out: the
          # updaters (update.ps1 + verify_kit.ps1, both Linux update.sh) check a download by its
          # SHA-256 and then by `gh attestation verify` on that same file, so each kit file a
          # release has must be a subject. The .sha256 files are only checked, not signed.
          subjects=()
          for f in "Squadala-$TAG-windows.zip" "oot-coop-$TAG.zip" "oot-coop-$TAG-windows.zip"; do
            if [ -f "$f" ]; then subjects+=("$PWD/$f"); fi
          done
          for f in oot-coop-"$TAG"-linux-*.tar.gz "oot-coop-$TAG-linux.zip" "Squadala-$TAG-linux.zip"; do
            if [ ! -f "$f" ]; then continue; fi
            # update.sh never takes a Linux kit without its .sha256: sign none without one either.
            if [ ! -f "$f.sha256" ]; then echo "::error::release $TAG has $f but no $f.sha256"; exit 1; fi
            sha256sum -c "$f.sha256"
            subjects+=("$PWD/$f")
          done
          if [ -f Update.bat ]; then subjects+=("$PWD/Update.bat"); fi
          printf '%s\n' "${subjects[@]}" > subjects.txt
          echo "Attesting:"; cat subjects.txt
          {
            echo "subjects<<EOF"
            cat subjects.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        id: assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.subjects }}
      - name: Verify the attestation
        run: |
          # The same list the attest step signed: each one must verify as the updaters check it.
          while IFS= read -r f; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-attest.yml"
          done < kit/subjects.txt

  self-test:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Make a made-up kit zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force selftest/oot-coop-v0.0.0-beta | Out-Null
          Set-Content selftest/oot-coop-v0.0.0-beta/README.txt "release-attest self-test $env:GITHUB_SHA $env:GITHUB_RUN_ID"
          & "$env:SystemRoot\System32\tar.exe" -a -c -f selftest/oot-coop-v0.0.0-beta.zip -C selftest oot-coop-v0.0.0-beta
          $hash = (Get-FileHash selftest/oot-coop-v0.0.0-beta.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/selftest/oot-coop-v0.0.0-beta.zip.sha256", "$hash  oot-coop-v0.0.0-beta.zip`n")
          # A made-up Linux kit under the v0.11.0 name (oot-coop-<tag>-linux.zip) the Linux update.sh looks for.
          New-Item -ItemType Directory -Force selftest/oot-coop-v0.0.0-beta-linux | Out-Null
          Set-Content selftest/oot-coop-v0.0.0-beta-linux/README.txt "release-attest self-test linux $env:GITHUB_SHA $env:GITHUB_RUN_ID"
          & "$env:SystemRoot\System32\tar.exe" -a -c -f selftest/oot-coop-v0.0.0-beta-linux.zip -C selftest oot-coop-v0.0.0-beta-linux
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            selftest/oot-coop-v0.0.0-beta.zip
            selftest/oot-coop-v0.0.0-beta-linux.zip
      - name: The Linux kit zip verifies as update.sh checks it
        shell: bash
        run: |
          gh attestation verify selftest/oot-coop-v0.0.0-beta-linux.zip --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-attest.yml"
      - name: verify_kit.ps1 accepts the attested zip
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify_kit.ps1 -Zip selftest/oot-coop-v0.0.0-beta.zip -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "verify_kit.ps1 refused the attested zip ($LASTEXITCODE)" }
      - name: verify_kit.ps1 refuses a changed zip
        shell: pwsh
        run: |
          Copy-Item selftest/oot-coop-v0.0.0-beta.zip selftest/changed.zip
          Add-Content selftest/changed.zip "x" -NoNewline
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify_kit.ps1 -Zip selftest/changed.zip -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) { throw "verify_kit.ps1 accepted a changed zip" }
          Write-Host "Changed zip refused (exit $LASTEXITCODE), as it should be."
          # The .sha256 check too: the original zip with a wrong checksum file.
          Copy-Item selftest/oot-coop-v0.0.0-beta.zip selftest/wrongsum.zip
          [IO.File]::WriteAllText("$PWD/selftest/wrongsum.zip.sha256", ("0" * 64) + "  wrongsum.zip`n")
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/verify_kit.ps1 -Zip selftest/wrongsum.zip -Repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) { throw "verify_kit.ps1 accepted a zip whose .sha256 does not match" }
          Write-Host "Wrong .sha256 refused (exit $LASTEXITCODE), as it should be."
          exit 0
