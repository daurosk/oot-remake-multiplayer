# Once a day: is Frizti's Fritchii (the emulator our kit is built on) newer than lichii/PIN?
# Then one issue "Fritchii <tag> is out", so the next co-op release moves the kit's emulator to
# it (lichii/README.md). Pre-releases count, drafts never. No duplicates: an issue with that
# title, open or closed, is never opened again. Only the workflow's own token is used.
name: Fritchii watch

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Fritchii's newest release with lichii/PIN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=$(sed -n 's#^repo=https://github.com/##p' lichii/PIN)
          pin=$(sed -n 's/^tag=//p' lichii/PIN)
          # The version in a tag: fritchii-v5.5 -> 5.5.
          ver() { printf '%s\n' "$1" | sed -n 's/^[^0-9]*\([0-9][0-9.]*[0-9]\|[0-9]\).*$/\1/p'; }
          newest=$(gh api "repos/$repo/releases?per_page=50" --jq '.[] | select(.draft | not) | .tag_name' |
            while read -r tag; do v=$(ver "$tag"); if [ -n "$v" ]; then printf '%s %s\n' "$v" "$tag"; fi; done |
            sort -V | tail -n 1 | cut -d' ' -f2)
          if [ -z "$newest" ]; then echo "No release of $repo found."; exit 0; fi
          echo "Pinned: $pin ($(ver "$pin")). Newest of $repo: $newest ($(ver "$newest"))."
          higher=$(printf '%s\n%s\n' "$(ver "$pin")" "$(ver "$newest")" | sort -V | tail -n 1)
          if [ "$(ver "$newest")" = "$(ver "$pin")" ] || [ "$higher" = "$(ver "$pin")" ]; then
            echo "lichii/PIN is up to date."; exit 0
          fi
          title="Fritchii ${newest#fritchii-} is out"
          seen=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$title in:title" --limit 50 \
            --json title --jq ".[] | select(.title == \"$title\") | .title")
          if [ -n "$seen" ]; then echo "There is already an issue \"$title\"."; exit 0; fi
          body=$(printf '%s\n' \
            "Frizti published [$newest](https://github.com/$repo/releases/tag/$newest); lichii/PIN is \`$pin\`." \
            "" \
            "Move the co-op build to it for the next release: re-apply lichii/patches on $newest, update lichii/PIN, build, run the unit tests and an autotest, then make the kit (docs/testing.md, \"Making the kit\"). Players get it through the kit's own updater; Fritchii's updater stays off in our builds." \
            "" \
            "Opened by the Fritchii watch workflow (.github/workflows/fritchii-watch.yml).")
          if [ "${DRY_RUN:-}" = "1" ]; then printf 'Would open "%s":\n%s\n' "$title" "$body"; exit 0; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
