name: Build

# Two tiers, so a push to a work branch does not fill the free runners' queue:
# - fast tier, on a push to any branch: linux gcc unit tests and python-tools on
#   ubuntu, Python 3.12. About 7 minutes, 2 jobs.
# - full tier: every job below. On a push to main or integrate-*, on a tag, on a
#   pull request into main, and on a manual run (Actions > Build > Run workflow,
#   pick the branch) when a branch wants the full proof before integration.
#   linux-emulator (hook compile) is full tier too, and also runs on pushes to
#   linux-build and linux-2.
# A pull request from a branch of this repo into anything but main runs nothing:
# the push already ran it. A pull request from a fork runs the fast tier.
# Docs-only changes skip Build; Content guard still checks them.
#
# The full-tier test is repeated in each job's `if` or matrix (GitHub has no
# shared expressions):
#   github.event_name == 'workflow_dispatch'
#   || (github.event_name == 'pull_request' && github.base_ref == 'main')
#   || (github.event_name == 'push' && (github.ref == 'refs/heads/main'
#       || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/tags/')))

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the branch's older run. The event is in the group so a push
# does not cancel a manual full run on the same branch. Runs on main and on tags
# are kept: each merge keeps its own proof.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # The puppet pack tool runs on the player's PC (Windows, any recent Python 3), so its
  # tests run there too, on the oldest and newest Python we support. The tests use
  # made-up data only; nothing from the game is needed. Fast tier: ubuntu, 3.12 only.
  python-tools:
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/tags/')))) && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/tags/')))) && '["3.10", "3.12"]' || '["3.12"]') }}
    runs-on: ${{ matrix.os }}
    name: python-tools (${{ matrix.os }}, ${{ matrix.python }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install zstandard
      - name: Puppet pack tests
        run: python tools/puppet_pack/tests/test_puppet_pack.py -v
      - name: Title menu rows tests
        run: python tools/puppet_pack/tests/test_title_menu.py -v
      - name: Save flags tests
        run: python tools/autotest/tests/test_save_flags.py -v
      - name: Hookshot autotest driver tests
        run: python tools/autotest/tests/test_hookshot.py -v
      - name: Bad-connection relay tests
        run: python tools/netsim/tests/test_netsim.py -v
      # The kit's patch applier for Hookshot (hookshot-kit); skipped until that branch is merged.
      - name: Kit patch applier tests
        if: hashFiles('tools/release/tests/test_apply_patch.py') != ''
        run: python tools/release/tests/test_apply_patch.py -v
      - name: Puppet pack command lines
        run: |
          python tools/puppet_pack/build.py --help
          python tools/puppet_pack/place_test.py --help
          python -m puppet_pack.build --help
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: tools

  # Full tier only. MSVC with Ninja so sccache can cache each object file
  # (sccache keeps them in the GitHub Actions cache).
  windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/tags/')))
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Fetched libraries cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/enet.cmake', 'cmake/doctest.cmake', 'cmake/monocypher.cmake') }}
      - name: Fetch libraries (ENet, doctest, Monocypher) at their pinned commits
        shell: bash
        run: |
          fetch() {  # name, url, cmake file with the GIT_TAG commit
            local dir=".deps/$1" rev
            rev=$(sed -n 's/.*GIT_TAG *\([0-9a-f]\{40\}\).*/\1/p' "$3")
            [ -n "$rev" ] || { echo "no GIT_TAG commit in $3"; exit 1; }
            if [ -f "$dir.rev" ] && [ "$(cat "$dir.rev")" = "$rev" ]; then return; fi
            rm -rf "$dir"; git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$2" "$rev"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "$rev" > "$dir.rev"
          }
          fetch enet https://github.com/lsalzman/enet.git cmake/enet.cmake
          fetch doctest https://github.com/doctest/doctest.git cmake/doctest.cmake
          fetch monocypher https://github.com/LoupVaillant/Monocypher.git cmake/monocypher.cmake
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad  # v0.0.9
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja -DCOOP_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DFETCHCONTENT_SOURCE_DIR_ENET="$(pwd -W)/.deps/enet"
          -DFETCHCONTENT_SOURCE_DIR_DOCTEST="$(pwd -W)/.deps/doctest"
          -DFETCHCONTENT_SOURCE_DIR_MONOCYPHER="$(pwd -W)/.deps/monocypher"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: sccache stats
        run: sccache --show-stats
      - name: Kit updater tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/update_test.ps1
      - name: Kit path check tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/paths_test.ps1
      - name: Kit hosting tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/hosting_test.ps1
      - name: Kit launch-update tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/launch_test.ps1
      - name: Kit mod check tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/mods_test.ps1
      - name: Kit log masking tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/log_mask_test.ps1

  # gcc: Release, -Werror (fast tier). clang: the same with clang. asan: clang
  # Debug with ASan + UBSan. tsan: clang Debug with TSan. asan and tsan also run
  # coop_test with 2 clients for 20 seconds. Everything but gcc is full tier.
  linux:
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/tags/')))) && '["gcc", "clang", "asan", "tsan"]' || '["gcc"]') }}
    name: linux (${{ matrix.job }})
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 400M
      # make -j with no limit ran the runner out of memory (exit 143 after ~2.5 min): 4 jobs.
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Settings for ${{ matrix.job }}
        env:
          JOB: ${{ matrix.job }}
        run: |
          # -Werror: our code builds clean at -Wall -Wextra -Wpedantic.
          # ENet is built with -w, so this only holds our own targets to it.
          case "$JOB" in
            gcc)   cc=gcc;   cxx=g++;     args="-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror"; soak=0 ;;
            clang) cc=clang; cxx=clang++; args="-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror"; soak=0 ;;
            asan)  cc=clang; cxx=clang++; args="-DCMAKE_BUILD_TYPE=Debug -DCOOP_SANITIZE=ON"; soak=1 ;;
            tsan)  cc=clang; cxx=clang++; args="-DCMAKE_BUILD_TYPE=Debug -DCOOP_TSAN=ON"; soak=1 ;;
            *) echo "unknown job $JOB"; exit 1 ;;
          esac
          { echo "CC=$cc"; echo "CXX=$cxx"; echo "COOP_ARGS=$args"; echo "COOP_SOAK=$soak"; } >> "$GITHUB_ENV"
      - name: Install ccache
        run: sudo apt-get install -y -q ccache || { sudo apt-get update -q && sudo apt-get install -y -q ccache; }
      - name: ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .ccache
          key: ccache-${{ matrix.job }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.job }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-${{ matrix.job }}-
      - name: Fetched libraries cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/enet.cmake', 'cmake/doctest.cmake', 'cmake/monocypher.cmake') }}
      - name: Fetch libraries (ENet, doctest, Monocypher) at their pinned commits
        run: |
          fetch() {  # name, url, cmake file with the GIT_TAG commit
            local dir=".deps/$1" rev
            rev=$(sed -n 's/.*GIT_TAG *\([0-9a-f]\{40\}\).*/\1/p' "$3")
            [ -n "$rev" ] || { echo "no GIT_TAG commit in $3"; exit 1; }
            if [ -f "$dir.rev" ] && [ "$(cat "$dir.rev")" = "$rev" ]; then return; fi
            rm -rf "$dir"; git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$2" "$rev"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "$rev" > "$dir.rev"
          }
          fetch enet https://github.com/lsalzman/enet.git cmake/enet.cmake
          fetch doctest https://github.com/doctest/doctest.git cmake/doctest.cmake
          fetch monocypher https://github.com/LoupVaillant/Monocypher.git cmake/monocypher.cmake
      # Newer runner kernels use more mmap randomness than older TSan runtimes
      # accept ("unexpected memory mapping"); lower it for this job.
      - name: Lower ASLR entropy for TSan
        if: matrix.job == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -DCOOP_BUILD_TESTS=ON $COOP_ARGS
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DFETCHCONTENT_SOURCE_DIR_ENET="$GITHUB_WORKSPACE/.deps/enet"
          -DFETCHCONTENT_SOURCE_DIR_DOCTEST="$GITHUB_WORKSPACE/.deps/doctest"
          -DFETCHCONTENT_SOURCE_DIR_MONOCYPHER="$GITHUB_WORKSPACE/.deps/monocypher"
      - name: Build
        run: cmake --build build --parallel 4
      - name: ccache stats
        run: ccache --show-stats
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Linux kit tests
        if: matrix.job == 'gcc'
        run: bash tools/release/tests/linux_kit_test.sh
      - name: Linux Longshot kit tests
        if: matrix.job == 'gcc'
        run: bash tools/release/tests/linux_longshot_kit_test.sh
      - name: coop_test, 2 clients for 20 seconds
        if: env.COOP_SOAK == '1'
        run: |
          set -o pipefail
          ./build/tools/coop_test/coop_test --clients 2 --seconds 20 --report-every 5 | tee coop_test.log
          grep -q '^result: PASS' coop_test.log

  # Co-op on Longshot for Linux and Steam Deck (docs/setup-linux.md): the module as a .so and
  # the server, built on Ubuntu 22.04 (glibc 2.35, Longshot's own baseline) and loaded as the patched
  # game loads it (tests/hookshot/load_module.c); the Linux kit zip (tools/release/make_kit_linux.sh);
  # then the kit's own scripts/build.sh without a game: Longshot's Linux builder (hookshot/LINUX.txt)
  # unpacked, our patches applied, Longshot's Linux tools fetched, and the patched renderer compiled.
  # The game itself needs a player's files: not here. Full tier, plus pushes to linux-longshot.
  linux-longshot:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/linux-longshot'))
    runs-on: ubuntu-22.04
    name: linux-longshot (module, kit, patched renderer)
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Compilers and tools
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-12 zip
      - name: Build the module and the server
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
            -DCOOP_BUILD_HOOKSHOT=ON -DCOOP_BUILD_TESTS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build --target hookshot_coop coop_server --parallel 4
      - name: The module loads as the game loads it
        run: |
          set -o pipefail
          module=$(find build -name hookshot_coop.so -type f | head -n1)
          server=$(find build -name coop_server -type f -perm -u+x | head -n1)
          test -n "$module" && test -n "$server"
          echo "MODULE=$module" >> "$GITHUB_ENV"
          echo "SERVER=$server" >> "$GITHUB_ENV"
          gcc -O2 -o "$RUNNER_TEMP/load_module" tests/hookshot/load_module.c
          "$RUNNER_TEMP/load_module" "$module"
          # (no C++ runtime needed from the system, and nothing newer than glibc 2.35)
          for f in "$module" "$server"; do
            if objdump -p "$f" | grep -E 'NEEDED.*(libstdc\+\+|libgcc_s)'; then echo "::error::$f needs the system's C++ runtime"; exit 1; fi
            newest=$(objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -t. -k1,1 -k2,2n -u | tail -n1)
            echo "$f: newest glibc symbol $newest"
            [ "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -n1)" = GLIBC_2.35 ] || { echo "::error::$f needs $newest"; exit 1; }
          done
      - name: The Linux kit
        run: |
          release=$(if [ "$GITHUB_REF_TYPE" = tag ]; then echo "$GITHUB_REF_NAME"; else echo "ci-${GITHUB_SHA::8}"; fi)
          bash tools/release/make_kit_linux.sh --module "$MODULE" --server "$SERVER" --licenses build \
            --release "$release" --out "$RUNNER_TEMP/kit"
          (cd "$RUNNER_TEMP/kit" && sha256sum -c oot-coop-*-linux-x86_64.zip.sha256)
          unzip -l "$RUNNER_TEMP"/kit/oot-coop-*-linux-x86_64.zip | tail -n +4 | head -n 60
          echo "KIT=$(ls -d "$RUNNER_TEMP"/kit/oot-coop-*-linux)" >> "$GITHUB_ENV"
      - name: Longshot's Linux builder with our patches, and the patched renderer (no game)
        run: bash "$KIT/scripts/build.sh" --renderer-only "$RUNNER_TEMP/vk" --jobs 4
      - name: A first start without a game stops in plain words
        run: |
          set +e
          out=$(bash "$KIT/start-oot-coop.sh" --no-update </dev/null 2>&1)
          code=$?
          printf '%s\n' "$out" | tail -n 15
          [ $code -ne 0 ] && printf '%s' "$out" | grep -q 'needs your game file' || { echo "::error::expected the no-game message"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: oot-coop-linux-longshot-x86_64
          path: |
            ${{ runner.temp }}/kit/oot-coop-*-linux-x86_64.zip
            ${{ runner.temp }}/kit/oot-coop-*-linux-x86_64.zip.sha256
          retention-days: 14

  # The co-op emulator on Linux (issue 127): Fritchii at lichii/PIN with our patches and the
  # hook, configured as Fritchii's own Linux release is (lichii/build-linux.sh). On every full-tier run
  # only the hook's files are compiled; the whole emulator, its AppImage and a start without a
  # game run on the linux-build and linux-2 branches, on tags and by hand (workflow_dispatch).
  linux-emulator:
    # Full tier, plus pushes to the Linux branches (their full part, the AppImage, is gated below).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/linux-build' || github.ref == 'refs/heads/linux-2'))
    runs-on: ubuntu-24.04
    name: linux-emulator (${{ matrix.part }})
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: [hook, full]
    steps:
      - name: Skip the full build here
        id: gate
        shell: bash
        env:
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = full ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] &&
             [ "$GITHUB_REF" != refs/heads/linux-build ] && [ "$GITHUB_REF" != refs/heads/linux-2 ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.gate.outputs.run == 'true'
      # The packages Fritchii's Linux release installs (release-binaries.yml).
      - name: Install Linux dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build pkg-config zlib1g-dev libva-dev libvdpau-dev \
            libavfilter-dev libavcodec-dev libswscale-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev xvfb \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install Qt
        if: steps.gate.outputs.run == 'true'
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005  # v4.3.0
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true
      - name: Emulator dependency cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/cpm-cache
          key: fritchii-cpm-${{ hashFiles('lichii/PIN') }}
      - name: Compile the co-op hook
        if: steps.gate.outputs.run == 'true' && matrix.part == 'hook'
        run: lichii/build-linux.sh --src "$RUNNER_TEMP/fritchii" --cpm-cache "$RUNNER_TEMP/cpm-cache" --hook-only
      - name: Build the emulator and its AppImage
        if: steps.gate.outputs.run == 'true' && matrix.part == 'full'
        run: lichii/build-linux.sh --src "$RUNNER_TEMP/fritchii" --cpm-cache "$RUNNER_TEMP/cpm-cache" --appimage "$RUNNER_TEMP/lichii.AppImage"
      # No game here: start it with no display, check it runs, logs its version and has the
      # hook, then stop it. "coop: loaded" itself is logged when a game starts.
      - name: Start without a game
        if: steps.gate.outputs.run == 'true' && matrix.part == 'full'
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/smoke/user"
          cd "$RUNNER_TEMP/smoke"
          status=0
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen timeout 30 "$RUNNER_TEMP/lichii.AppImage" || status=$?
          echo "exit status $status (124: still running after 30 s, stopped)"
          ls -R user | head -n 20
          log=user/log/eden_log.txt
          test -s "$log"
          grep -m3 -i "version" "$log" || true
          if grep -q -i "crash\|segmentation" "$log"; then exit 1; fi
          test "$status" = 0 -o "$status" = 124
      # The Linux kit tarball (tools/release/make_kit.sh) with this AppImage and a Linux server.
      - name: Build the server and the Linux kit
        if: steps.gate.outputs.run == 'true' && matrix.part == 'full'
        run: |
          cmake -S . -B build-server -DCMAKE_BUILD_TYPE=Release -DCOOP_BUILD_TESTS=OFF
          cmake --build build-server --target coop_server --parallel
          server=$(find build-server -type f -name coop_server -perm -u+x | head -n1)
          test -n "$server"
          bash tools/release/appimage_licenses.sh "$RUNNER_TEMP/lichii.AppImage" "$RUNNER_TEMP/appimage-licenses"
          head -n 60 "$RUNNER_TEMP/appimage-licenses/BUNDLED.txt"
          bash tools/release/make_kit.sh --appimage-licenses "$RUNNER_TEMP/appimage-licenses" --appimage "$RUNNER_TEMP/lichii.AppImage" --server "$server" \
