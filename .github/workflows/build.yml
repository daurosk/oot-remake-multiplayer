name: Build

# Two tiers (docs/testing.md, "CI tiers"). One full run per batch, not per branch:
# - branch tier (a push to a work branch no longer starts Build: see `on: push` below; kept for a pull request from a fork, which runs it): linux gcc unit tests (plus a compile of
#   the Hookshot module, the hook code) and python-tools on ubuntu with Python 3.12, and
#   Content guard (its own workflow). The Fritchii emulator is retired (0.11.12): no job
#   builds or ships it; lichii/hook stays, compiled into the Hookshot module. A
#   branch's real gate is the local check (coord-multiplayer offline local-ci.ps1: MSVC
#   build, ctest and the windows job's script steps), so windows-hook runs only for a
#   pull request from a fork into another branch than main, which has no local check.
# - full tier (batch tier): every job below. On a push to main or integrate-* (the
#   integrator's merge of a batch of branches), on a pull request into main, and on a
#   manual run (Actions > Build > Run workflow). There windows builds the module itself.
# - tag tier, on a tag push: only what a release needs. A release tag (v*) runs
#   linux-longshot (the Linux kit, artifact oot-coop-linux: an after-check of the
#   prebuilt kit the release uploads); any other tag (longshot-mirror-*) runs no Build job.
#   Content guard runs on every push (its own workflow). The tagged commit already passed
#   the full tier on integrate-* (and on main); a manual run stays full.
# A pull request from a branch of this repo into anything but main runs nothing:
# the push already ran it. A pull request from a fork runs the branch tier.
# Docs-only changes skip Build; Content guard still checks them.
# BRANCH TIER of a manual run (OWNER 2026-11-28 00:16 UTC via B #160): a workflow_dispatch on a work branch runs scope,
# python-tools (ubuntu 3.12, windows 3.12), windows, linux (clang), and linux-longshot unless every changed
# file is one it never reads (tools/ci_scope.py LONGSHOT_NEVER_READ_*; scope output `longshot`). asan, tsan, gcc and Python 3.10 run only on integrate-*/main/
# release-*/tag Builds (and a pull request into main); a red integrate batch gets bisected. The work-branch dispatch test:
#   github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/integrate-')
#   && !startsWith(github.ref, 'refs/heads/release-') && !startsWith(github.ref, 'refs/tags/')
# Scope (B #131, 2026-11-26): a manual run on a work branch whose diff vs its merge-base with the `base` input
# (default auto = the newest origin/integrate-* by merge-base, tools/ci_scope.py auto_base) touches only python-only paths (tools/ci_scope.py SCOPED: tools/autotest, docs, *.md, ...)
# runs python-tools only; windows, linux and linux-longshot are SKIPPED and the scope job's summary says
# 'scope: python-only (files: ...)'. main, integrate-*, release-*, tags, pushes and pull requests always run full.
#
# The full-tier test is repeated in each job's `if` or matrix (GitHub has no
# shared expressions):
#   github.event_name == 'workflow_dispatch'
#   || (github.event_name == 'pull_request' && github.base_ref == 'main')
#   || (github.event_name == 'push' && (github.ref == 'refs/heads/main'
#       || startsWith(github.ref, 'refs/heads/integrate-')))
# and the jobs that also run on a branch push have `!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))` (tag tier).

on:
  push:
    # Only main, integrate-*, release-* and tags: a push to a work branch starts nothing (every work-branch push used to start a
    # full Build while the worker dispatched one on the same sha: 13 duplicate runs, 2026-11-25). A work branch gets
    # Build by workflow_dispatch (one full run on the sha logged ready); Content guard is its own workflow and still runs.
    branches:
      - main
      - "integrate-*"
      - "release-*"
    tags:
      - "**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      base:
        description: "Branch the scope job diffs against (merge-base); auto = the newest integrate-*; a python-only diff skips the C++ jobs"
        required: false
        default: auto

permissions:
  contents: read

# A manual run on a work branch (the only Build a work branch gets: its pushes start none) cancels that
# branch's older manual run. The event is in the group so a push does not cancel a manual full run on the
# same branch. Runs on main, integrate-*, release-* and tags are kept, each with its own finished proof: their
# group also holds the commit, because a group keeps only one waiting run and a third push would otherwise
# cancel the second while the first still runs (0.11.4: back-to-back integration pushes left twelve merges
# without a finished run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/')) && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/integrate-') && !startsWith(github.ref, 'refs/heads/release-') && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Full or python-only (header, 'Scope'). Runs on every event; only a manual run on a work branch can come out
  # python-only. The C++ jobs need it, so it must never be skipped.
  scope:
    runs-on: ${{ (github.repository == 'daurosk/oot-remake-multiplayer' && github.actor == 'daurosk' && github.triggering_actor == 'daurosk' && vars.COOP_SELF_HOSTED_LINUX == 'on' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/'))))) && fromJSON('["self-hosted", "linux", "x64", "squadala-wsl"]') || 'ubuntu-latest' }}
    outputs:
      full: ${{ steps.scope.outputs.full }}
      longshot: ${{ steps.scope.outputs.longshot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        env:
          SCOPE_BASE: ${{ inputs.base || 'auto' }}
        run: python3 tools/ci_scope.py --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --base "$SCOPE_BASE" >> "$GITHUB_OUTPUT"

  # The puppet pack tool runs on the player's PC (Windows, any recent Python 3), so its
  # tests run there too, on the oldest and newest Python we support. The tests use
  # made-up data only; nothing from the game is needed. Fast tier: ubuntu, 3.12 only.
  python-tools:
    if: (github.event_name != 'pull_request' || github.base_ref == 'main' || github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-')))) && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(!(github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/integrate-') && !startsWith(github.ref, 'refs/heads/release-') && !startsWith(github.ref, 'refs/tags/')) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-')))) && '["3.10", "3.12"]' || '["3.12"]') }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (github.repository == 'daurosk/oot-remake-multiplayer' && github.actor == 'daurosk' && github.triggering_actor == 'daurosk' && vars.COOP_SELF_HOSTED_LINUX == 'on' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/'))))) && fromJSON('["self-hosted", "linux", "x64", "squadala-wsl"]') || matrix.os }}
    name: python-tools (${{ matrix.os }}, ${{ matrix.python }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install zstandard numpy pytest pytest-xdist pytest-timeout pillow scikit-image   # (in-game test system: tools/autotest/ingame)
      - name: Puppet pack tests
        run: python tools/puppet_pack/tests/test_puppet_pack.py -v
      - name: Sound archive reader and writer tests
        run: python tools/puppet_pack/tests/test_bwav.py -v
      - name: Character Select voice rules tests
        run: python tools/puppet_pack/tests/test_voice_map.py -v
      - name: Character Select voice builder tests
        run: python tools/puppet_pack/tests/test_voices.py -v
      - name: Title menu rows tests
        run: python tools/puppet_pack/tests/test_title_menu.py -v
      - name: UI pack library tests (parts, labels, strings files)
        run: python tools/puppet_pack/tests/test_ui_pack.py -v
      - name: Pause menu Multiplayer tab and page tests
        run: python tools/puppet_pack/tests/test_pause_menu.py -v
      - name: Co-op's own - menu screen (CoopMenu_00) tests
        run: python tools/puppet_pack/tests/test_coop_menu.py -v
      - name: Difficulty designed enemies tests
        run: python tools/puppet_pack/tests/test_designed_enemies.py -v
      - name: Enemies deleted by our Link's area tests
        run: python tools/puppet_pack/tests/test_area_deleted.py -v
      - name: Difficulty extra enemy spots tests
        run: python tools/puppet_pack/tests/test_extra_spots.py -v
      - name: Story cutscene requests tests
        run: python tools/puppet_pack/tests/test_story_requests.py -v
      - name: Room objects (own logic) tests
        run: python tools/puppet_pack/tests/test_room_objects.py -v
      - name: Unnamed room bools tests
        run: python tools/puppet_pack/tests/test_autogen_flags.py -v
      - name: Boss beaten sets tests
        run: python tools/puppet_pack/tests/test_boss_beaten.py -v
      - name: Start points table tests
        run: python tools/puppet_pack/tests/test_start_points.py -v
      - name: Story event effects tests
        run: python tools/puppet_pack/tests/test_story_effects.py -v
      - name: Save flags tests
        run: python tools/autotest/tests/test_save_flags.py -v
      - name: Hookshot autotest driver tests
        run: python tools/autotest/tests/test_hookshot.py -v
      - name: Ocarina key/note table tests
        run: python tools/autotest/tests/test_ocarina_notes.py -v
      - name: Live play-test kit tests (desync check, MCP server)
        run: python tools/autotest/tests/test_playtest.py -v
      - name: Sync digest compare tests
        run: python tools/autotest/tests/test_compare_digest.py -v
      - name: Play-test bridge client and MCP tools tests (fake bridge)
        run: python tools/autotest/tests/test_playtest_bridge.py -v
      # (it plays tools/autotest/ingame/test_smoke.py, tools/autotest/ingame/test_rows.py and
      # tools/autotest/ingame/test_gear_link.py and tools/autotest/ingame/test_leather_link.py on two fake bridges)
      - name: In-game test system selftests (fake games, no game)
        run: python tools/autotest/tests/test_ingame.py -v
      - name: In-game test source check ('%' format arity, SETUP-FAIL source; probe0121-c53046a6)
        run: python tools/autotest/tests/test_fmtcheck.py -v
      - name: In-game VOID gpu-reset label selftests (fake driver events)
        run: python tools/autotest/tests/test_gpu_reset.py -v
      - name: In-game rejoin, server restart, lan251 and host-menu (rows 292/170) selftests (fake live.py)
        run: |
          python tools/autotest/tests/test_ingame_rejoin.py -v
          python tools/autotest/tests/test_ingame_host_menu.py -v
      - name: Host-starved reading of a set-up frame timeout selftests (no game)
        run: python tools/autotest/tests/test_host_starved.py -v
      - name: Test game window placement tests
        run: python tools/autotest/tests/test_placement.py -v
      - name: hs.py cache, locks and game build tests
        run: python tools/hookshot/tests/test_hs.py -v
      - name: Play-test kit helpers tests (step_until, delta state, call log, doctor)
        run: python tools/autotest/tests/test_kit_tools.py -v
      - name: Play-test look (one-call situation text) tests
        run: python tools/autotest/tests/test_kit_look.py -v
      - name: Play-test wait_until tests
        run: python tools/autotest/tests/test_kit_wait.py -v
      - name: Play-test fight tests
        run: python tools/autotest/tests/test_kit_fight.py -v
      - name: Play-test go_to and record_route (routes) tests
        run: python tools/autotest/tests/test_kit_route.py -v
      - name: Play-test kit moves tests (shoot, climb, push, jump)
        run: python tools/autotest/tests/test_kit_move.py -v
      - name: Play-test kit doctor tests
        run: python tools/autotest/tests/test_kit_doctor.py -v
      - name: Shared play-test library (scripts and data) tests
        run: python tools/autotest/tests/test_kit_library.py -v
      - name: Shared play-test library check (every script and data file)
        run: python tools/autotest/kit_library.py check
      - name: Play-test bridge proof checks tests
        run: python tools/autotest/tests/test_bridge_proof.py -v
      - name: Play-test desync check (world compare, sync-coverage rows) tests
        run: python tools/autotest/tests/test_desync_check.py -v
      - name: hs.py no-window helpers tests (no console flashing in lane runs)
        run: python tools/hookshot/tests/test_no_window.py -v
      - name: hs.py shared game files tests
        run: python tools/hookshot/tests/test_hs_share.py -v
      - name: Mods' code patches (Longshot patches 0034, 0035) tests
        run: python tools/hookshot/tests/test_exefs_patches.py -v
      - name: Puppet bow guard (Longshot patch 0038) tests
        run: python tools/hookshot/tests/test_puppet_bow_guard.py -v
      - name: The kit's size table, actor rows and menu archives merge tests
        run: python tools/puppet_pack/tests/test_merge_tables.py -v
      - name: The kit's Character Select part check (row 280) tests
        run: python tools/puppet_pack/tests/test_part_check.py -v
      - name: Character Select's readable names tests
        run: python tools/puppet_pack/tests/test_charsel_names.py -v
      - name: Test lanes tests
        run: python tools/autotest/tests/test_lanes.py -v
      - name: Steps files on Hookshot (hs_steps.py, its key verb) tests
        run: python tools/autotest/tests/test_hs_steps.py -v
      - name: Autotest groups tests
        run: python tools/autotest/tests/test_groups.py -v
      - name: rc plan (both lanes) tests
        run: python tools/autotest/tests/test_rc_plan.py -v
      - name: rc in-game tests plan + summary tests
        run: python tools/autotest/tests/test_rc_tests.py -v
      - name: Screenshot proof tests
        run: python tools/autotest/tests/test_proof.py -v
      - name: Kit-mode autotest tests
        run: python tools/autotest/tests/test_kit_pair.py -v
      - name: Bad-connection relay tests
        run: python tools/netsim/tests/test_netsim.py -v
      - name: Discord bug-report bot tests
        run: python tools/discord-bot/tests/test_report_core.py -v
      - name: Problem-report intake tests (the bot's upload endpoint)
        run: python tools/discord-bot/tests/test_intake_core.py -v
      - name: Linux kit problem reports (problem_report.py) tests
        run: python tools/release/tests/test_problem_report_py.py -v
      - name: Content guard tests (test names with ';')
        run: python tools/tests/test_check_content.py -v
      - name: Build scope (python-only runs) tests
        run: python tools/tests/test_ci_scope.py -v
      - name: Study tools tests (main reader, vtables, callers)
        run: python tools/game_scan/tests/test_game_scan.py -v
      - name: Game names file tests
        run: python tools/game_scan/tests/test_game_names.py -v
      - name: MSBT reader tests
        run: python tools/puppet_pack/tests/test_msbt.py -v
      # The kit's patch applier for Hookshot (hookshot-kit); skipped until that branch is merged.
      - name: Kit patch applier tests
        if: hashFiles('tools/release/tests/test_apply_patch.py') != ''
        run: python tools/release/tests/test_apply_patch.py -v
      - name: Kit Discord status tests
        run: python tools/release/tests/test_discord_status.py -v
      - name: Randomizer kit presets tests
        run: python tools/rando/tests/test_check_presets.py -v
      - name: Randomizer kit presets decoded with the pinned OOTRR (row 53; downloads it, fails when it cannot)
        run: python tools/rando/check_presets.py
      # Test files no step named before (tools/check_content.py now fails any test_*.py under tools/ that no workflow names).
      - name: Steps file tests
        run: python tools/autotest/tests/test_hs_steps.py -v
      - name: Kit setup tests
        run: python tools/autotest/tests/test_kit_setup.py -v
      - name: Character Select UI tests
        run: python tools/puppet_pack/tests/test_charsel_ui.py -v
      - name: Eye switch tests
        run: python tools/puppet_pack/tests/test_eye_switches.py -v
      - name: HUD pack tests
        run: python tools/puppet_pack/tests/test_hud.py -v
      - name: Puppet pack map icons tests
        run: python tools/puppet_pack/tests/test_map_icons.py -v
      - name: Party HUD pack tests
        run: python tools/puppet_pack/tests/test_party_hud.py -v
      - name: Look cap tests
        run: python tools/puppet_pack/tests/test_look_cap.py -v
      - name: Look metal tests
        run: python tools/puppet_pack/tests/test_look_metal.py -v
      - name: Presence gate tests
        run: python tools/puppet_pack/tests/test_presence_gates.py -v
      - name: Room graph tests
        run: python tools/puppet_pack/tests/test_room_graph.py -v
      - name: Self tunic tests
        run: python tools/puppet_pack/tests/test_self_tunic.py -v
      - name: Shared anchor tests
        run: python tools/puppet_pack/tests/test_shared_anchors.py -v
      # The Windows kit's puppet pack tool staged as make_kit_hookshot.ps1 stages it (kit_pack.ps1) and run from that
      # copy alone: a module, data folder or strings file the pack needs and the kit misses fails here (the 0.11.12
      # integrate-01110 kit lacked charsel\data and coopmenu\data). Here, not in the windows job: that one may run on the
      # self-hosted PC, which has no Python on PATH.
      - name: Windows kit puppet pack stage tests
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/kit_pack_test.ps1
      - name: Windows kit puppet pack without numpy (regression C2-1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/puppet_pack_numpy_test.ps1
      - name: Puppet pack command lines
        run: |
          python tools/puppet_pack/build.py --help
          python tools/puppet_pack/place_test.py --help
          python -m puppet_pack.build --help
          python tools/puppet_pack/msbt.py --help
          python tools/game_scan/vtables.py --help
          python tools/game_scan/callers.py --help
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: tools

  # Full tier only. MSVC with Ninja so sccache can cache each object file
  # (sccache keeps them in the GitHub Actions cache).
  # Self-hosted runner (docs/ci-runner.md): this job uses the owner's PC only for a
  # push by daurosk to daurosk's repo, and only while the repo variable
  # COOP_SELF_HOSTED is 'on'. Pull requests (forks included), manual runs and
  # pushes by anyone else always get windows-latest. Turn the runner off by
  # setting COOP_SELF_HOSTED to anything else; jobs fall back to GitHub.
  # (Not installed: the owner dropped the Windows runner on 2026-11-26; COOP_SELF_HOSTED stays unset.)
  # The Linux jobs (scope, python-tools' ubuntu row, linux) use the WSL runners (squadala-wsl): daurosk's own
  # push to main, integrate-*, release-* or a tag, or daurosk's manual run, while COOP_SELF_HOSTED_LINUX is
  # 'on'; pull requests never. linux-longshot stays on ubuntu-22.04 (its glibc 2.35 baseline).
  windows:
    needs: scope
    if: needs.scope.outputs.full == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-'))))
    runs-on: ${{ (github.event_name == 'push' && github.repository == 'daurosk/oot-remake-multiplayer' && github.actor == 'daurosk' && github.triggering_actor == 'daurosk' && vars.COOP_SELF_HOSTED == 'on') && fromJSON('["self-hosted", "windows", "x64", "daurosk-pc"]') || 'windows-latest' }}
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      # Game tests run on the same PC: below-normal priority for this job's
      # steps (they are children of Runner.Worker and inherit it). The hosted
      # runner is skipped.
      - name: Lower priority on the owner's PC
        if: runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $p = Get-CimInstance Win32_Process -Filter "ProcessId = $PID"
          while ($p -and $p.Name -ne 'Runner.Worker.exe') { $p = Get-CimInstance Win32_Process -Filter "ProcessId = $($p.ParentProcessId)" }
          if (-not $p) { throw 'Runner.Worker.exe not found' }
          (Get-Process -Id $p.ProcessId).PriorityClass = 'BelowNormal'
          "Runner.Worker $($p.ProcessId): BelowNormal"
          # Git for Windows has only Git\cmd on the machine PATH; the bash steps need Git\bin.
          $git = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path "$git\bash.exe")) { throw "no bash in $git" }
          Add-Content -Encoding utf8 $env:GITHUB_PATH $git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Fetched libraries cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/enet.cmake', 'cmake/doctest.cmake', 'cmake/monocypher.cmake') }}
      - name: Fetch libraries (ENet, doctest, Monocypher) at their pinned commits
        shell: bash
        run: |
          fetch() {  # name, url, cmake file with the GIT_TAG commit
            local dir=".deps/$1" rev
            rev=$(sed -n 's/.*GIT_TAG *\([0-9a-f]\{40\}\).*/\1/p' "$3")
            [ -n "$rev" ] || { echo "no GIT_TAG commit in $3"; exit 1; }
            if [ -f "$dir.rev" ] && [ "$(cat "$dir.rev")" = "$rev" ]; then return; fi
            rm -rf "$dir"; git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$2" "$rev"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "$rev" > "$dir.rev"
          }
          fetch enet https://github.com/lsalzman/enet.git cmake/enet.cmake
          fetch doctest https://github.com/doctest/doctest.git cmake/doctest.cmake
          fetch monocypher https://github.com/LoupVaillant/Monocypher.git cmake/monocypher.cmake
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad  # v0.0.9
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja -DCOOP_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DFETCHCONTENT_SOURCE_DIR_ENET="$(pwd -W)/.deps/enet"
          -DFETCHCONTENT_SOURCE_DIR_DOCTEST="$(pwd -W)/.deps/doctest"
          -DFETCHCONTENT_SOURCE_DIR_MONOCYPHER="$(pwd -W)/.deps/monocypher"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # Our Longshot patches' Windows code (host/*.c, gpu/vk/*.cpp and their includers), compiled syntax only with
      # Longshot's own llvm-mingw clang and build.py's flags: nothing else in CI compiles it for Windows (the Linux jobs
      # build the renderer alone, for Linux), and 0.11.4's patch 0025 reached a game build with a character literal
      # that did not compile. Downloads: the pinned tools.lock, llvm-mingw, Python, CPM headers and source, mirror
      # first, SHA-256 checked, cached by the pin.
      - name: Longshot downloads cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .longshot-dl
          key: longshot-dl-${{ hashFiles('hookshot/PIN', 'tools/release/kit/hookshot/TOOLS.txt') }}
      - name: Our patches' Windows host code compiles (Longshot's clang, syntax only)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/hookshot/host_compile_check.ps1 -Cache "$env:GITHUB_WORKSPACE\.longshot-dl"
      - name: sccache stats
        run: sccache --show-stats
      - name: Kit updater tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/update_test.ps1
      - name: Kit path check tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/paths_test.ps1
      - name: Kit Nucleus handler refresh tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/nucleus_handler_test.ps1
      - name: Kit no-Python menu park tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/menu_park_test.ps1
      - name: Kit hosting tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/hosting_test.ps1
      - name: Nucleus handler tests
        run: cscript //nologo //E:jscript tools/nucleus/test_handler.js
      - name: Kit local co-op (2 to 4 games on one PC) tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/local_coop_test.ps1
      - name: Kit launch-update tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/launch_test.ps1
      - name: Kit test-mode game start (no window activation) tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/kit_test_start_test.ps1
      - name: Kit mod check tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/mods_test.ps1
      - name: Kit mod restart tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/mod_restart_test.ps1
      - name: Kit game files and test-kit hold tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/kit_build_files_test.ps1
      - name: Kit path question tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/paste_test.ps1
      - name: Kit log masking tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/log_mask_test.ps1
      - name: Kit problem report tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/problem_report_test.ps1
      - name: Kit problem report sending tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/problem_send_test.ps1
      - name: Kit dependency licence tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/release/tests/kit_deps_test.ps1
      - name: CI runner hook tests
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-runner/job_started_test.ps1
      - name: WSL runners' lane check tests (status-feed.ps1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-runner/wsl/status_feed_test.ps1
      - name: CI runner script checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-runner/scripts_test.ps1

  # The Windows module's compile (MSVC, the hook's own compiler) for a pull request from a
  # fork into another branch than main (the windows job does not run there, and a fork has
  # no local check): hookshot_coop only, no tests or kit. Our own branches get the same
  # compile from local-ci.ps1 (their gate), so pushes skip it. Always GitHub's runner.
  windows-hook:
    if: github.event_name == 'pull_request' && github.base_ref != 'main' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Fetched libraries cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/enet.cmake', 'cmake/doctest.cmake', 'cmake/monocypher.cmake') }}
      - name: Fetch libraries (ENet, Monocypher) at their pinned commits
        shell: bash
        run: |
          fetch() {  # name, url, cmake file with the GIT_TAG commit
            local dir=".deps/$1" rev
            rev=$(sed -n 's/.*GIT_TAG *\([0-9a-f]\{40\}\).*/\1/p' "$3")
            [ -n "$rev" ] || { echo "no GIT_TAG commit in $3"; exit 1; }
            if [ -f "$dir.rev" ] && [ "$(cat "$dir.rev")" = "$rev" ]; then return; fi
            rm -rf "$dir"; git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$2" "$rev"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "$rev" > "$dir.rev"
          }
          fetch enet https://github.com/lsalzman/enet.git cmake/enet.cmake
          fetch monocypher https://github.com/LoupVaillant/Monocypher.git cmake/monocypher.cmake
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad  # v0.0.9
      - name: Compile the hook code (the Hookshot module)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCOOP_BUILD_TESTS=OFF -DCOOP_BUILD_HOOKSHOT=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DFETCHCONTENT_SOURCE_DIR_ENET="$(pwd -W)/.deps/enet" \
            -DFETCHCONTENT_SOURCE_DIR_MONOCYPHER="$(pwd -W)/.deps/monocypher"
          cmake --build build --target hookshot_coop --parallel

  # gcc: Release, -Werror (fast tier). clang: the same with clang. asan: clang
  # Debug with ASan + UBSan. tsan: clang Debug with TSan. asan and tsan also run
  # coop_test with 2 clients for 20 seconds. Everything but gcc is full tier.
  linux:
    needs: scope
    if: needs.scope.outputs.full == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main' || github.event.pull_request.head.repo.full_name != github.repository) && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ (github.repository == 'daurosk/oot-remake-multiplayer' && github.actor == 'daurosk' && github.triggering_actor == 'daurosk' && vars.COOP_SELF_HOSTED_LINUX == 'on' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/heads/release-') || startsWith(github.ref, 'refs/tags/'))))) && fromJSON('["self-hosted", "linux", "x64", "squadala-wsl"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON((github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/integrate-') && !startsWith(github.ref, 'refs/heads/release-') && !startsWith(github.ref, 'refs/tags/')) && '["clang"]' || ((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-')))) && '["gcc", "clang", "asan", "tsan"]' || '["gcc"]')) }}
    name: linux (${{ matrix.job }})
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 400M
      # make -j with no limit ran the runner out of memory (exit 143 after ~2.5 min): 4 jobs.
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Settings for ${{ matrix.job }}
        env:
          JOB: ${{ matrix.job }}
        run: |
          # -Werror: our code builds clean at -Wall -Wextra -Wpedantic.
          # ENet is built with -w, so this only holds our own targets to it.
          case "$JOB" in
            gcc)   cc=gcc;   cxx=g++;     args="-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror"; soak=0 ;;
            clang) cc=clang; cxx=clang++; args="-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror"; soak=0 ;;
            asan)  cc=clang; cxx=clang++; args="-DCMAKE_BUILD_TYPE=Debug -DCOOP_SANITIZE=ON"; soak=1 ;;
            tsan)  cc=clang; cxx=clang++; args="-DCMAKE_BUILD_TYPE=Debug -DCOOP_TSAN=ON"; soak=1 ;;
            *) echo "unknown job $JOB"; exit 1 ;;
          esac
          { echo "CC=$cc"; echo "CXX=$cxx"; echo "COOP_ARGS=$args"; echo "COOP_SOAK=$soak"; } >> "$GITHUB_ENV"
      # The WSL runners share one ccache (setup.sh: /var/cache/squadala-ccache, 20 GB) instead of the Actions cache.
      - name: Shared ccache on the WSL runners
        if: runner.environment == 'self-hosted'
        run: |
          { echo "CCACHE_DIR=/var/cache/squadala-ccache"; echo "CCACHE_MAXSIZE=20G"; } >> "$GITHUB_ENV"
          echo "runner $RUNNER_NAME: shared ccache /var/cache/squadala-ccache"
      - name: Install ccache
        run: sudo apt-get install -y -q ccache || { sudo apt-get update -q && sudo apt-get install -y -q ccache; }
      - name: ccache
        if: runner.environment != 'self-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .ccache
          key: ccache-${{ matrix.job }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.job }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-${{ matrix.job }}-
      - name: Fetched libraries cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .deps
          key: deps-${{ hashFiles('cmake/enet.cmake', 'cmake/doctest.cmake', 'cmake/monocypher.cmake') }}
      - name: Fetch libraries (ENet, doctest, Monocypher) at their pinned commits
        run: |
          fetch() {  # name, url, cmake file with the GIT_TAG commit
            local dir=".deps/$1" rev
            rev=$(sed -n 's/.*GIT_TAG *\([0-9a-f]\{40\}\).*/\1/p' "$3")
            [ -n "$rev" ] || { echo "no GIT_TAG commit in $3"; exit 1; }
            if [ -f "$dir.rev" ] && [ "$(cat "$dir.rev")" = "$rev" ]; then return; fi
            rm -rf "$dir"; git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$2" "$rev"
            git -C "$dir" checkout -q FETCH_HEAD
            echo "$rev" > "$dir.rev"
          }
          fetch enet https://github.com/lsalzman/enet.git cmake/enet.cmake
          fetch doctest https://github.com/doctest/doctest.git cmake/doctest.cmake
          fetch monocypher https://github.com/LoupVaillant/Monocypher.git cmake/monocypher.cmake
      # Newer runner kernels use more mmap randomness than older TSan runtimes
      # accept ("unexpected memory mapping"); lower it for this job.
      - name: Lower ASLR entropy for TSan
        if: matrix.job == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -DCOOP_BUILD_TESTS=ON $COOP_ARGS
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DFETCHCONTENT_SOURCE_DIR_ENET="$GITHUB_WORKSPACE/.deps/enet"
          -DFETCHCONTENT_SOURCE_DIR_DOCTEST="$GITHUB_WORKSPACE/.deps/doctest"
          -DFETCHCONTENT_SOURCE_DIR_MONOCYPHER="$GITHUB_WORKSPACE/.deps/monocypher"
      - name: Build
        run: cmake --build build --parallel 4
      # The hook code (lichii/hook, hookshot/src) builds into the Hookshot module, and the
      # jobs that build that (windows, linux-longshot) run on main, integrate-*, tags and
      # pull requests only. This step is the one that compiles it on every other push, so a
      # worker branch sees its own compile errors before the integrator's build.
      # COOP_HOOK_STRICT=ON gives the lichii/hook files GCC's strict flags (-O3,
      # -Werror=all/extra: hookshot/CMakeLists.txt). The compiler is g++-13 (what the retired
      # emulator job used): ubuntu-latest's default g++ (15.2) does not raise the
      # -Wstringop-truncation that 13.3 raises (0.11.8).
      - name: Compile the hook code (the Hookshot module)
        if: matrix.job == 'gcc'
        run: |
          command -v g++-13 >/dev/null || sudo apt-get install -y -q g++-13
          cmake -S . -B build-hook -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_BUILD_TYPE=Release -DCOOP_BUILD_HOOKSHOT=ON -DCOOP_BUILD_TESTS=OFF -DCOOP_HOOK_STRICT=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_SOURCE_DIR_ENET="$GITHUB_WORKSPACE/.deps/enet" \
            -DFETCHCONTENT_SOURCE_DIR_MONOCYPHER="$GITHUB_WORKSPACE/.deps/monocypher"
          cmake --build build-hook --target hookshot_coop --parallel 4
      - name: ccache stats
        run: ccache --show-stats
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Linux Longshot kit tests
        if: matrix.job == 'gcc'
        run: bash tools/release/tests/linux_longshot_kit_test.sh
      - name: Longshot builder's Python has Character Select's tool packages
        if: matrix.job == 'gcc'
        run: bash tools/release/tests/appimage_python_test.sh
      - name: Kit dependency licence tests (Linux)
        if: matrix.job == 'gcc'
        run: bash tools/release/tests/kit_deps_test.sh
      - name: coop_test, 2 clients for 20 seconds
        if: env.COOP_SOAK == '1'
        run: |
          set -o pipefail
          ./build/tools/coop_test/coop_test --clients 2 --seconds 20 --report-every 5 | tee coop_test.log
          grep -q '^result: PASS' coop_test.log

  # Co-op on Longshot for Linux and Steam Deck (docs/setup-linux.md): the module as a .so and
  # the server, built on Ubuntu 22.04 (glibc 2.35, Longshot's own baseline) and loaded as the patched
  # game loads it (tests/hookshot/load_module.c); the Linux kit zip (tools/release/make_kit_linux.sh);
  # then the kit's own scripts/build.sh without a game: Longshot's Linux builder (hookshot/LINUX.txt)
  # unpacked, our patches applied, Longshot's Linux tools fetched, and the patched renderer compiled.
  # The game itself needs a player's files: not here. Full tier, pushes to linux-longshot, and the tag tier
  # (a release tag v*: the only Build job of a tag push).
  linux-longshot:
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.longshot == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integrate-') || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/linux-longshot')))
    runs-on: ubuntu-22.04
    name: linux-longshot (module, kit, patched renderer)
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Compilers and tools
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-12 zip
      - name: Build the module and the server
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 \
            -DCOOP_BUILD_HOOKSHOT=ON -DCOOP_BUILD_TESTS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build --target hookshot_coop coop_server --parallel 4
      - name: The module loads as the game loads it
        run: |
          set -o pipefail
          module=$(find build -name hookshot_coop.so -type f | head -n1)
          server=$(find build -name coop_server -type f -perm -u+x | head -n1)
          test -n "$module" && test -n "$server"
          echo "MODULE=$module" >> "$GITHUB_ENV"
          echo "SERVER=$server" >> "$GITHUB_ENV"
          gcc -O2 -o "$RUNNER_TEMP/load_module" tests/hookshot/load_module.c
          "$RUNNER_TEMP/load_module" "$module"
          # (no C++ runtime needed from the system, and nothing newer than glibc 2.35)
          for f in "$module" "$server"; do
            if objdump -p "$f" | grep -E 'NEEDED.*(libstdc\+\+|libgcc_s)'; then echo "::error::$f needs the system's C++ runtime"; exit 1; fi
            newest=$(objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -t. -k1,1 -k2,2n -u | tail -n1)
            echo "$f: newest glibc symbol $newest"
            [ "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -n1)" = GLIBC_2.35 ] || { echo "::error::$f needs $newest"; exit 1; }
          done
      # (also in linux (gcc); here too, so they run when that job is stopped by another target's -Werror)
      - name: The module's Linux clipboard tests and the kit tests
        run: |
          cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DCOOP_BUILD_TESTS=ON
          cmake --build build-tests --target coop_tests --parallel 4
          "$(find build-tests -name coop_tests -type f -perm -u+x | head -n1)" -tc='Linux clipboard*'
          bash tools/release/tests/linux_longshot_kit_test.sh
      - name: The Linux kit
        run: |
          release=$(if [ "$GITHUB_REF_TYPE" = tag ]; then echo "$GITHUB_REF_NAME"; else echo "ci-${GITHUB_SHA::8}"; fi)
          bash tools/release/make_kit_linux.sh --module "$MODULE" --server "$SERVER" --licenses build \
            --release "$release" --out "$RUNNER_TEMP/kit"
          # Squadala-<tag>-linux.zip and its .sha256 only (no oot-coop-* copy from v0.11.4 on)
          (cd "$RUNNER_TEMP/kit" && sha256sum -c Squadala-*-linux.zip.sha256)
          if ls "$RUNNER_TEMP"/kit/oot-coop-* >/dev/null 2>&1; then echo "::error::the kit has an oot-coop-* asset"; exit 1; fi
          unzip -l "$RUNNER_TEMP"/kit/Squadala-*-linux.zip | tail -n +4 | head -n 60
          # every pack data file (charsel/data: the Characters tab and its code patch; coopmenu/data: CoopMenu_00), byte for byte
          kitdir=$(ls -d "$RUNNER_TEMP"/kit/Squadala-*-linux)
          for f in tools/puppet_pack/*/data/*; do
            cmp -s "$f" "$kitdir/data/$f" || { echo "::error::the kit misses $f (or it differs)"; exit 1; }
          done
          echo "KIT=$(ls -d "$RUNNER_TEMP"/kit/Squadala-*-linux)" >> "$GITHUB_ENV"
      # The kit's own puppet pack tool, run from the kit alone (python -I): every module build.py imports, every path a
      # module names (charsel/data, coopmenu/data, strings) and the data they read (as kit_pack_test.ps1 for Windows;
      # build.sh runs build.py from data/tools on the players' PCs).
      - name: The Linux kit's puppet pack tool runs from the kit alone
        run: python3 -I tools/release/tests/kit_pack_check.py "$KIT/data"
      - name: Longshot's Linux builder with our patches, and the patched renderer (no game)
        run: bash "$KIT/scripts/build.sh" --renderer-only "$RUNNER_TEMP/vk" --jobs 4
      # (the renderer build compiles no host file: our patches' host/*.c and host/posix/*.c, syntax only, with
      # Longshot's Linux clang and build.py's flags; the windows job does the same for Windows)
      - name: Our patches' Linux host code compiles (Longshot's clang, syntax only)
        run: bash tools/hookshot/host_compile_check.sh "$KIT"
      # (patch 0039: the Insert menu's pads, in front and behind other windows, on the patched source; Longshot's own
      # tests/ is not in the AppImage, so the test is ours)
      - name: Patch 0039's menu pads on the patched source
        run: python3 -I -B tools/hookshot/menu_pads_behind_test.py "$KIT/data/builder/source" --cc gcc-12
      - name: A first start without a game stops in plain words
        run: |
          set +e
          out=$(bash "$KIT/start-squadala.sh" --no-update </dev/null 2>&1)
          code=$?
          printf '%s\n' "$out" | tail -n 15
          [ $code -ne 0 ] && printf '%s' "$out" | grep -q 'needs your game file' || { echo "::error::expected the no-game message"; exit 1; }
          # one start file: the old name (start-oot-coop.sh, up to v0.11.3) is not in the kit
          [ ! -e "$KIT/start-oot-coop.sh" ] || { echo "::error::the kit still has start-oot-coop.sh"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: oot-coop-linux
          path: |
            ${{ runner.temp }}/kit/Squadala-*-linux.zip
            ${{ runner.temp }}/kit/Squadala-*-linux.zip.sha256
          retention-days: 14
