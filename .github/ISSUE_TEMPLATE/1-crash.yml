name: Crash
description: The game or Squadala! (the co-op mod) closes, freezes or shows an error.
labels: [bug, crash]
body:
  - type: markdown
    attributes:
      value: Do not attach or link game files, keys, firmware or builds that contain them. Issues that do are closed.
  - type: input
    id: version
    attributes:
      label: Squadala! version and game version
      description: The first line of the kit's VERSION.txt, and the game version.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where you played
      options:
        - An old emulator kit (Lichii / Fritchii, retired)
        - Hookshot (experimental)
        - The Linux kit (experimental)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: How you connected
      options:
        - Invite code (Host.bat / Join.bat)
        - VPN (Radmin VPN, Hamachi, ZeroTier, Tailscale)
        - Port forwarding
        - Relay with a join code
        - Same network (LAN)
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you were doing, and what happened instead of what you expected.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the last co-op lines (`coop:`) of the game's log, addresses masked. Send the full log zip from `scripts\collect-logs.cmd` with `/bugreport` on the Squadala! Discord, not here, and give its report number here.
      render: text
